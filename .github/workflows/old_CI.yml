name: old CI

on:
  # Trigger the workflow after the new CI succeeded on a push
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches:
      - "master"
      - "develop"

  # Trigger the workflow manually
  workflow_dispatch: ~

jobs:
  # Run CI including downstream packages on self-hosted runners
  downstream-ci:
    name: downstream-ci
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success') }}
    uses: ecmwf/downstream-ci/.github/workflows/downstream-ci.yml@main
    with:
      ci_group: only-self
      gribjump: ecmwf/gribjump@${{ github.event.workflow_run.head_sha || github.sha }}
      # Legacy CFFI CI; pybind11 is covered by the pygribjump package matrix.
      # pygribjump: pygribjump:ecmwf/gribjump@${{ github.event.workflow_run.head_sha || github.sha }}
      codecov_upload: true
      clang_format: true
    secrets: inherit

  # Run Rust CI (fmt + clippy + test) on the rust/ workspace
  ci-rust:
    name: ci-rust
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success') }}
    uses: ecmwf/reusable-workflows/.github/workflows/ci-rust.yml@main
    with:
      manifest-path: rust/Cargo.toml
      features: --features gribjump-sys/vendored
      # Single-threaded: GribJump::new() takes no config parameter and reads
      # FDB5_CONFIG from the environment, so parallel tests clobber it mid-flight
      # and trip catalogue->open() assertions inside FDB.
      test-args: --workspace -- --test-threads=1
    secrets:
      private_repos_token: ${{ secrets.GH_REPO_READ_TOKEN }}

  # Build downstream packages on HPC
  downstream-ci-hpc:
    name: downstream-ci-hpc
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success') }}
    uses: ecmwf/downstream-ci/.github/workflows/downstream-ci-hpc.yml@main
    with:
      ci_group: only-self
      gribjump: ecmwf/gribjump@${{ github.event.workflow_run.head_sha || github.sha }}
      # Legacy CFFI CI; pybind11 is covered by the pygribjump package matrix.
      # pygribjump: pygribjump:ecmwf/gribjump@${{ github.event.workflow_run.head_sha || github.sha }}
    secrets: inherit
