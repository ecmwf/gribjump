[workspace]
resolver = "2"
members = ["crates/gribjump-sys", "crates/gribjump"]

[workspace.package]
version = "0.13.1"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/ecmwf/gribjump"
rust-version = "1.90"
readme = "README.md"
keywords = ["ecmwf", "weather", "meteorology", "grib", "climate"]
categories = ["science", "parser-implementations"]

[workspace.dependencies]
# Internal
gribjump-sys = { version = "0.13", path = "crates/gribjump-sys" }
gribjump = { version = "0.13", path = "crates/gribjump" }

# FDB dependency
fdb = { version = "5.24", default-features = false }
fdb-sys = { version = "5.24", default-features = false }

# Foundation crates
eckit-sys = { version = "2.5", default-features = false }
eckit = "2.5"
metkit-sys = { version = "1.22", default-features = false }
metkit = "1.22"
eccodes-sys = { version = "2.49", default-features = false, features = ["vendored", "eccodes-threads", "aec"] }

# Build tools
bindman = "0.2"
bindman-build = "0.2"
bindman-utils = "0.2"

# External
thiserror = "2"
cxx = "1.0"
cxx-build = "1.0"
parking_lot = "0.12"
tempfile = "3"
