[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-vv -s"
testpaths = [
    "./python/pygribjump/tests"
]

# pyproject.toml

[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "pygribjump"
description = "Python interface to GribJump"
readme = "README.md"
requires-python = ">=3.10"
# NOTE do *not* include static dependencies here -- we need dynamicity for the gribjumplib constraint
dynamic = ["version", "dependencies", "optional-dependencies"]
authors = [
    { name = "ECMWF", email = "software.support@ecmwf.int" }
]
license = "Apache-2.0"
license-files = ["LICENSE"]
urls = { "Home" = "https://github.com/ecmwf/gribjump" }

[tool.setuptools.dynamic]
version = { file = ["VERSION"] }

[tool.setuptools]
packages = ["pygribjump"]
package-dir = { "pygribjump" = "./python/pygribjump/src/pygribjump" }
include-package-data = true
zip-safe = false

[tool.setuptools.package-data]
"pygribjump" = [
    "VERSION", 
    "gribjump_c.h"
]
